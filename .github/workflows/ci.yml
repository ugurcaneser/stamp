name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q launcher.py cli core gui

      - name: Check shell syntax
        run: bash -n helper/stamp-helper packaging/build-deb.sh packaging/debian/postinst assets/make-icons.sh windows/scripts/build-exe.sh

  package:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Inspect package metadata
        run: dpkg-deb --info dist/*.deb

  macos:
    name: macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Check build script syntax
        run: bash -n macos/scripts/build-app.sh

      - name: Build app and DMG (ad-hoc signed)
        run: ./macos/scripts/build-app.sh

  windows-core:
    name: Windows core (FAT32 checked with dosfstools)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dosfstools and mtools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Run unit tests
        env:
          STAMP_REQUIRE_FAT_TOOLS: "1"
        run: dotnet test windows/tests/StampCore.Tests

  windows:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit tests
        run: dotnet test windows/tests/StampCore.Tests

      - name: Build Stamp.exe
        shell: bash
        run: ./windows/scripts/build-exe.sh

      - name: Upload Stamp.exe
        uses: actions/upload-artifact@v4
        with:
          name: stamp-windows
          path: dist/windows/Stamp-*-win-x64.exe

      - name: Real Windows path against a 40 GB VHD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'card.vhdx'
          "create vdisk file=`"$vhd`" maximum=40960 type=expandable`r`nselect vdisk file=`"$vhd`"`r`nattach vdisk`r`n" |
            Out-File -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vhd.txt')
          diskpart /s (Join-Path $env:RUNNER_TEMP 'vhd.txt')
          if ($LASTEXITCODE -ne 0) { throw 'could not create the VHD' }
          $number = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number

          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          New-Item -ItemType Directory -Force (Join-Path $payload 'firmware') | Out-Null
          [IO.File]::WriteAllText((Join-Path $payload 'readme.txt'), 'hello from stamp')
          $bytes = New-Object byte[] (3MB); (New-Object Random 42).NextBytes($bytes)
          [IO.File]::WriteAllBytes((Join-Path $payload 'firmware\boot.bin'), $bytes)
          $zip = Join-Path $env:RUNNER_TEMP 'payload.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($payload, $zip)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip); $archive.Entries | Format-Table FullName, Length; $archive.Dispose()

          dotnet run --project windows/tests/Integration -- $number $zip
          if ($LASTEXITCODE -ne 0) { throw 'the Stamp job failed' }

          # Ejecting may take the volume offline; bring it back to inspect it.
          Get-Disk -Number $number | Where-Object IsOffline | Set-Disk -IsOffline $false
          $volume = Get-Partition -DiskNumber $number | Get-Volume
          $volume | Format-List DriveLetter, FileSystem, FileSystemLabel, Size
          if ($volume.FileSystem -ne 'FAT32') { throw "file system is $($volume.FileSystem), not FAT32" }
          if ($volume.FileSystemLabel -ne 'CI CARD') { throw "label is $($volume.FileSystemLabel)" }
          $letter = $volume.DriveLetter
          if ((Get-Content -Raw "${letter}:\readme.txt") -ne 'hello from stamp') { throw 'readme.txt differs' }
          if ((Get-FileHash "${letter}:\firmware\boot.bin").Hash -ne (Get-FileHash (Join-Path $payload 'firmware\boot.bin')).Hash) { throw 'boot.bin differs' }
          chkdsk "${letter}:"
          if ($LASTEXITCODE -ne 0) { throw "chkdsk reported problems ($LASTEXITCODE)" }
          Get-Content (Join-Path $env:LOCALAPPDATA 'Stamp\stamp.log')
