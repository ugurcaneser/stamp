name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q launcher.py cli core gui

      - name: Check shell syntax
        run: bash -n helper/stamp-helper packaging/build-deb.sh packaging/debian/postinst

  package:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Inspect package metadata
        run: dpkg-deb --info dist/*.deb
