name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q launcher.py cli core gui

      - name: Check shell syntax
        run: bash -n helper/stamp-helper packaging/build-deb.sh packaging/debian/postinst assets/make-icons.sh windows/scripts/build-exe.sh

  package:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Inspect package metadata
        run: dpkg-deb --info dist/*.deb

  macos:
    name: macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Check build script syntax
        run: bash -n macos/scripts/build-app.sh

      - name: Build app and DMG (ad-hoc signed)
        run: ./macos/scripts/build-app.sh

  windows-core:
    name: Windows core (FAT32 checked with dosfstools)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dosfstools and mtools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Run unit tests
        env:
          STAMP_REQUIRE_FAT_TOOLS: "1"
        run: dotnet test windows/tests/StampCore.Tests

  windows:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit tests
        run: dotnet test windows/tests/StampCore.Tests

      - name: Build Stamp.exe
        shell: bash
        run: ./windows/scripts/build-exe.sh

      - name: Upload Stamp.exe
        uses: actions/upload-artifact@v4
        with:
          name: stamp-windows
          path: dist/windows/Stamp-*-win-x64.exe
