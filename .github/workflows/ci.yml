name: CI

# Manual only (Actions tab or `gh workflow run ci.yml`): pushes don't start a
# run, so verify locally first and spend Actions minutes deliberately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q launcher.py cli core gui

      - name: Check shell syntax
        run: bash -n helper/stamp-helper packaging/stage.sh packaging/build-packages.sh packaging/postinstall.sh packaging/arch/PKGBUILD assets/make-icons.sh windows/scripts/build-exe.sh

  package:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          curl -fsSLo nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Check that the PKGBUILD matches the package version
        run: |
          nfpm_version="$(sed -n 's/^version: "\(.*\)"$/\1/p' packaging/nfpm.yaml)"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          echo "nfpm.yaml: $nfpm_version, PKGBUILD: $pkgbuild_version"
          [ "$nfpm_version" = "$pkgbuild_version" ]

      - name: Build packages
        run: ./packaging/build-packages.sh

      - name: Inspect package metadata
        run: dpkg-deb --info dist/*.deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: stamp-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  install:
    name: Install on ${{ matrix.image }}
    needs: package
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: stamp-linux
          path: dist

      - name: Install package
        run: ${{ matrix.install }}

      # The GUI can't start without a display, but every typelib it and
      # core/formatter.py load must resolve from the declared dependencies.
      - name: Check runtime dependencies
        run: |
          stamp --cli --help
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); gi.require_version('UDisks', '2.0'); from gi.repository import Gtk, Adw, UDisks, GLib"
          for tool in pkexec udisksctl lsblk findmnt parted partprobe mkfs.vfat rsync; do
            command -v "$tool" || { echo "missing: $tool"; exit 1; }
          done
          test -x /usr/lib/stamp/stamp-helper
          test -x /usr/lib/stamp/stamp-helper-unrestricted
          test -f /usr/share/polkit-1/actions/com.ugurcaneser.stamp.policy

  aur:
    name: Build the AUR PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel git

      - name: Check out repository
        uses: actions/checkout@v4

      # makepkg uses a source file that's already present instead of
      # downloading it, so this builds the PKGBUILD against this commit.
      # --nodeps: nothing is compiled; pacman -U pulls in the runtime depends.
      - name: Build and install the package
        run: |
          git config --global --add safe.directory "$PWD"
          pkgver="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          useradd -m builder
          install -d -o builder /tmp/aur
          cp packaging/arch/PKGBUILD /tmp/aur/
          git archive --prefix="stamp-$pkgver/" -o "/tmp/aur/stamp-$pkgver.tar.gz" HEAD
          chown -R builder /tmp/aur
          su builder -c "cd /tmp/aur && makepkg --noconfirm --nodeps"
          pacman -U --noconfirm /tmp/aur/stamp-*.pkg.tar.zst
          stamp --cli --help
          test -f /usr/share/polkit-1/actions/com.ugurcaneser.stamp.policy

  macos:
    name: macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Check build script syntax
        run: bash -n macos/scripts/build-app.sh

      - name: Build app and DMG (ad-hoc signed)
        run: ./macos/scripts/build-app.sh

  windows-core:
    name: Windows core (FAT32 checked with dosfstools)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dosfstools and mtools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools

      - name: Run unit tests
        env:
          STAMP_REQUIRE_FAT_TOOLS: "1"
        run: dotnet test windows/tests/StampCore.Tests

  windows:
    name: Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit tests
        run: dotnet test windows/tests/StampCore.Tests

      - name: Build Stamp.exe
        shell: bash
        run: ./windows/scripts/build-exe.sh

      - name: Upload Stamp.exe
        uses: actions/upload-artifact@v4
        with:
          name: stamp-windows
          path: dist/windows/Stamp-*-win-x64.exe

      - name: Real Windows path against a 40 GB VHD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'card.vhdx'
          "create vdisk file=`"$vhd`" maximum=40960 type=expandable`r`nselect vdisk file=`"$vhd`"`r`nattach vdisk`r`n" |
            Out-File -Encoding ascii (Join-Path $env:RUNNER_TEMP 'vhd.txt')
          diskpart /s (Join-Path $env:RUNNER_TEMP 'vhd.txt')
          if ($LASTEXITCODE -ne 0) { throw 'could not create the VHD' }
          $number = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number

          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          New-Item -ItemType Directory -Force (Join-Path $payload 'firmware') | Out-Null
          [IO.File]::WriteAllText((Join-Path $payload 'readme.txt'), 'hello from stamp')
          $bytes = New-Object byte[] (3MB); (New-Object Random 42).NextBytes($bytes)
          [IO.File]::WriteAllBytes((Join-Path $payload 'firmware\boot.bin'), $bytes)
          $zip = Join-Path $env:RUNNER_TEMP 'payload.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($payload, $zip)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip); $archive.Entries | Format-Table FullName, Length; $archive.Dispose()

          dotnet run --project windows/tests/Integration -- $number $zip
          if ($LASTEXITCODE -ne 0) { throw 'the Stamp job failed' }

          # Ejecting may take the volume offline; bring it back to inspect it.
          Get-Disk -Number $number | Where-Object IsOffline | Set-Disk -IsOffline $false
          $volume = Get-Partition -DiskNumber $number | Get-Volume
          $volume | Format-List DriveLetter, FileSystem, FileSystemLabel, Size
          if ($volume.FileSystem -ne 'FAT32') { throw "file system is $($volume.FileSystem), not FAT32" }
          if ($volume.FileSystemLabel -ne 'CI CARD') { throw "label is $($volume.FileSystemLabel)" }
          $letter = $volume.DriveLetter
          if ((Get-Content -Raw "${letter}:\readme.txt") -ne 'hello from stamp') { throw 'readme.txt differs' }
          if ((Get-FileHash "${letter}:\firmware\boot.bin").Hash -ne (Get-FileHash (Join-Path $payload 'firmware\boot.bin')).Hash) { throw 'boot.bin differs' }
          chkdsk "${letter}:"
          if ($LASTEXITCODE -ne 0) { throw "chkdsk reported problems ($LASTEXITCODE)" }
          Get-Content (Join-Path $env:LOCALAPPDATA 'Stamp\stamp.log')
